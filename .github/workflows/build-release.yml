name: Build & Release Installer

on:
  push:
    tags:
      - "v*.*.*"        # Trigger op versie-tags zoals v1.0.0
  workflow_dispatch:    # Handmatig starten vanuit GitHub UI
    inputs:
      version:
        description: "Versienummer (bijv. 1.0.0)"
        required: false
        default: "1.0.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # ── Python ───────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pdf2md/requirements.txt

      - name: Install Python dependencies
        working-directory: pdf2md
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Tesseract (optioneel; OCR-fallback) ──────────────────────────────────
      - name: Install Tesseract-OCR
        run: choco install tesseract --params="/Languages:nld" -y
        continue-on-error: true

      # ── PyInstaller: GUI ──────────────────────────────────────────────────────
      - name: Build PDF2MD_GUI
        working-directory: pdf2md
        run: |
          pyinstaller --onedir --noconsole --name PDF2MD_GUI `
            --hidden-import fitz --hidden-import fitz.fitz `
            --collect-all fitz `
            apps/main_gui.py

      # ── PyInstaller: DragDrop ─────────────────────────────────────────────────
      - name: Build PDF2MD_DragDrop
        working-directory: pdf2md
        run: |
          pyinstaller --onedir --noconsole --name PDF2MD_DragDrop `
            --hidden-import fitz --hidden-import fitz.fitz `
            --collect-all fitz `
            apps/dragdrop.py

      # ── Inno Setup ───────────────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup -y

      # ── Bepaal versienummer ───────────────────────────────────────────────────
      - name: Set version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace "^v", ""
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "1.0.0" }
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # ── Patch versienummer in setup.iss ──────────────────────────────────────
      - name: Patch version in setup.iss
        working-directory: pdf2md/installer
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          (Get-Content setup.iss) -replace 'AppVersion=.*', "AppVersion=$v" |
            Set-Content setup.iss

      # ── Inno Setup compileren ─────────────────────────────────────────────────
      - name: Compile installer
        working-directory: pdf2md
        run: iscc installer\setup.iss

      # ── Hernoem naar versie ───────────────────────────────────────────────────
      - name: Rename installer
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          Rename-Item `
            "pdf2md\installer\Output\PDF2MD_Setup.exe" `
            "PDF2MD_${v}_Setup.exe"

      # ── Upload als artifact ───────────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: PDF2MD-Setup-${{ steps.version.outputs.VERSION }}
          path: pdf2md/installer/Output/*.exe
          retention-days: 30

      # ── GitHub Release (alleen bij versie-tag) ────────────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2.3.2
        with:
          name: "PDF2MD v${{ steps.version.outputs.VERSION }}"
          body: |
            ## PDF2MD v${{ steps.version.outputs.VERSION }}

            ### Installatie
            1. Download `PDF2MD_${{ steps.version.outputs.VERSION }}_Setup.exe`
            2. Dubbelklik en volg de installatiewizard
            3. Optioneel: installeer Tesseract-OCR voor gescande PDF's:
               https://github.com/UB-Mannheim/tesseract/wiki → talen **nld** + **eng**

            ### Wat is er inbegrepen?
            - PDF2MD GUI (bureaubladsnelkoppeling)
            - PDF2MD DragDrop (rechtsklik op map → "Converteer naar Markdown")
          files: pdf2md/installer/Output/*.exe
          draft: false
          prerelease: false
